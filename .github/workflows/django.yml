name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [ "3.14" ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Create and Activate Virtual Environment
      run: |
        python -m venv venv
        source venv/bin/activate # Activate venv
        echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
        echo "$PWD/venv/bin" >> $GITHUB_PATH
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate throwaway SAML SP certs
      # saml/sp-cert.pem and sp-key.pem are gitignored (the private key must
      # never be committed), so a fresh checkout has neither file — but
      # shibboleth_auth's tests cover the file-based fallback path in
      # saml_config.py, which needs *some* real PEM pair on disk to read.
      # These are throwaway, used only to satisfy that test; production
      # never reads from disk at all (SAML_SP_CERT/SAML_SP_KEY env vars
      # take priority — see CLAUDE.md's "cert-deployment gap: resolved").
      run: bash saml/generate_certs.sh
    - name: Run Tests
      env:
        # None of these are real secrets required for tests to pass — they're
        # CI-only placeholders. `${{ secrets.X || 'fallback' }}` means: use a
        # real secret if one is ever configured, otherwise use the fallback.
        # This matters because an *unconfigured* GitHub secret evaluates to
        # an empty string, not a genuinely absent env var — and several of
        # these are read with django-environ's env("NAME") (no default),
        # which raises ImproperlyConfigured on missing, but happily accepts
        # an empty string as "provided". A bare ${{ secrets.X }} reference
        # here would either crash (env() with no default) or silently
        # produce garbage links in email bodies — neither caught by the
        # test suite before this was actually verified against a real run.
        #
        # DEVELOPMENT_MODE is the one load-bearing value: it's what sends
        # settings.py to the SQLite + mock-mode branch instead of expecting
        # a real DATABASE_URL/Postgres connection. Every run in this repo's
        # history failed before this was added — see CLAUDE.md's CI section.
        DEVELOPMENT_MODE: "True"
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-only-placeholder-not-for-production' }}
        EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER || 'ci@example.com' }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        RESET_PASSWORD_URL: ${{ secrets.RESET_PASSWORD_URL || 'http://localhost/reset-password' }}
        ACCOUNT_SET_UP_URL: ${{ secrets.ACCOUNT_SET_UP_URL || 'http://localhost/account-setup' }}
      run: |
        python manage.py test
